# XcodeGen spec: Codemagic turns this into PourLog.xcodeproj at build time.
name: PourLog
options:
  bundleIdPrefix: com.rickjanik
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  PourLog:
    type: application
    platform: iOS
    sources:
      - path: PourLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rickjanik.PourLog
        CODE_SIGN_ENTITLEMENTS: PourLog/PourLog.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pour Log
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Suggests the bar you're at and tags your drink with its location."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of your drink."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Read where an older photo was taken so the right bar is suggested."
